; Console commands plugin (loaded by The Grand Loader, dinput8.dll). Works with any mod: TGC, GFM, vanilla...
; Delete this file to disable the plugin completely.
[convert_pop]
; 0 = commands always available (default). 1 = only when "Console Commands (any mod)" is ticked in the launcher.
require_mod=0
; The game merges a moving pop into ANY pop of the same type and religion, ignoring culture (vanilla bug).
; migrate_pop always uses the fixed check. 1 = also fix it for the game itself (move_pop effects,
; internal migration). Changes game results: in multiplayer everyone needs the same value.
fix_merge_everywhere=0
; 1 = adds a COMENZI tab next to Military in the top bar (needs interface\zz_v2commands.gui + .gfx in the game folder).
; 0 = no tab (use 0 if the game ever crashes when entering a game).
topbar_tab=1
; 1 = blocs (bloc_add ...): in a war every member of a bloc joins the side of the member in it. 0 = off.
blocs=1
